# Nginx configuration file

events {
    worker_connections 1024;
}

http{
# Define the upstream FastAPI server
upstream api_server {
    server backend;
}

# Configure the server to serve the React app
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_name localhost;

    # Serve static files
    location / {
        try_files $uri /index.html;
    }

    # Forward API requests to the appropriate endpoint in the FastAPI server
    location /api/list_existing_vpc {
        proxy_pass http://api_server:8000/list_existing_vpc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/details {
        proxy_pass http://api_server:8000/details;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/create_vpc {
        proxy_pass http://api_server:8000/create_vpc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
}
