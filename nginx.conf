# Nginx configuration file

events {
    worker_connections 1024;
}

http{
# Define the upstream FastAPI server
upstream api_server {
    server backend:8000;
}

# Configure the server to serve the React app
server {
    listen 80;

    # Serve static files
    location / {
        try_files $uri /index.html;
    }

    # Forward API requests to the appropriate endpoint in the FastAPI server
    location /api/list_existing_vpc {
        proxy_pass http://api_server/list_existing_vpc;
    }

    location /api/details {
        proxy_pass http://api_server/details;
    }

    location /api/create_vpc {
        proxy_pass http://api_server/create_vpc;
    }
}
}
